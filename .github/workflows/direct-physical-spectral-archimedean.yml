name: direct physical spectral Archimedean audit

on:
  push:
    branches:
      - research/odd-sine-physical-bridge
  pull_request:
    branches:
      - research/support-monotone-route

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy mpmath
      - run: python experiments/direct_physical_spectral_archimedean_audit.py
