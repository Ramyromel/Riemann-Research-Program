name: direct physical spectral Archimedean audit

on:
  push:
    branches:
      - research/odd-sine-physical-bridge
  pull_request:
    branches:
      - research/support-monotone-route

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy mpmath
      - run: python -m py_compile experiments/physical_odd_archimedean.py experiments/direct_physical_odd_archimedean_audit.py experiments/direct_physical_spectral_archimedean_audit.py
      - run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "experiments")
          import direct_physical_spectral_archimedean_audit
          print("import_check=PASS")
          print("classification=OPEN_ANALYTIC_NORMALIZATION_BRIDGE")
          PY
      - run: python experiments/direct_physical_spectral_archimedean_audit.py
      - run: python experiments/odd_sine_archimedean_bridge_audit.py
