name: N3 matrix diagnostic

on:
  push:
    paths:
      - "experiments/archimedean_hankel/n3_matrix_diagnostic.py"
      - "experiments/archimedean_hankel/archimedean_hankel.py"
      - "docs/n3-matrix-diagnostic.md"
      - ".github/workflows/n3-matrix-diagnostic.yml"
  pull_request:
    paths:
      - "experiments/archimedean_hankel/n3_matrix_diagnostic.py"
      - "experiments/archimedean_hankel/archimedean_hankel.py"
      - "docs/n3-matrix-diagnostic.md"
      - ".github/workflows/n3-matrix-diagnostic.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "mpmath==1.4.1"
      - run: python experiments/archimedean_hankel/n3_matrix_diagnostic.py
