name: N3 tail structure

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/archimedean_hankel/n3_tail_structure.py"
      - "experiments/archimedean_hankel/archimedean_hankel.py"
      - ".github/workflows/n3-tail-structure.yml"
  pull_request:
    paths:
      - "experiments/archimedean_hankel/n3_tail_structure.py"
      - "experiments/archimedean_hankel/archimedean_hankel.py"
      - ".github/workflows/n3-tail-structure.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "mpmath==1.4.1"
      - run: python experiments/archimedean_hankel/n3_tail_structure.py
